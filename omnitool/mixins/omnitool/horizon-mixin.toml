# stack_tooltip_lines itself cannot be a target: it has closures and macros
# (format!), which no injection kind but HEAD allows, and HEAD refuses macros
# too. Its one caller that draws the item tooltip, draw_stack_tooltip_with, has
# only a closure, so a cancellable HEAD there takes over the drawing (the helper
# repeats the function's body with the extended lines).
[[injection]]
id = "hook_tooltip"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::stations::Game<'_>::draw_stack_tooltip_with"
helper = "hook_tooltip.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "creative", ty = "bool", value = "creative" },
  { name = "x", ty = "f32", value = "x" },
  { name = "y", ty = "f32", value = "y" },
  { name = "after_name", ty = "&Vec<(horizon_client::text::Text, u32)>", value = "&after_name" },
]

# World lines (docs/ARCHITECTURE.md, "World lines"): `fishing_line` builds
# the depth-tested gizmo lines of every frame (game.rs:12371, not gated by
# F3+B/F3+G). The cancellable HEAD runs the original body through a
# re-entry guard and appends Omnitool's lines (RETURN is not possible: the
# body has closures).
[[injection]]
id = "hook_world_lines"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::fishing::Game<'_>::fishing_line"
helper = "hook_world_lines.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "size", ty = "[u32; 2]", value = "size" },
]

# Game::chat_line (game/remote.rs:767) is the one place every connection line
# enters the chat component (whose own `add` lives in horizon-client-render).
# A cancellable HEAD lets Chat Tweaks hide a line or re-enter chat_line with
# decorated text (re-entry guard in the glue). The body has no closures.
[[injection]]
id = "hook_chat_line"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::remote::Game<'_>::chat_line"
helper = "hook_chat_line.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "content", ty = "&horizon_client::text::Text", value = "&content" },
  { name = "source", ty = "horizon_client::chat::ChatSource", value = "source" },
]

# Camera (docs/ARCHITECTURE.md, "Camera"): `turn_player` is `Entity.turn` for
# the player (mouse, pad, arrow keys, agent). The cancellable HEAD lets
# Freecam/Freelook take the turn so the player keeps its rotation.
[[injection]]
id = "hook_turn_player"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::turn_player"
helper = "hook_turn_player.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "xo", ty = "f64", value = "xo" },
  { name = "yo", ty = "f64", value = "yo" },
]

# `camera_view` is `Camera.alignWithEntity` + `getMaxZoom`, once per frame
# (game.rs:12280). The cancellable HEAD runs the original through a re-entry
# guard with the camera rotation swapped in (third-person pull-back included)
# and returns its result (RETURN is not possible: the body has closures).
[[injection]]
id = "hook_camera_view"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::camera_view"
helper = "hook_camera_view.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "partial", ty = "f32", value = "partial" },
]

# `camera_orientation` (`Camera.setRotation`) faces particles, fireworks and
# name tags toward the camera; it reads the player's rotation otherwise.
[[injection]]
id = "hook_camera_orientation"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::camera_orientation"
helper = "hook_camera_orientation.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

# Omnitool screens (World Map, later ClickGui). Horizon has no screen hook
# (`enum Screen` is closed) and window_event is full of macros, so the screen
# stays Screen::Playing with the cursor released (`capture(false)`) and this
# HEAD on follow_keymap (game.rs:1480, macro-free, called first in
# window_event with the event by &mut) takes the input while a screen is
# open: presses, wheel and clicks go to the screen and the event is replaced
# by a no-op; releases and cursor moves pass on.
[[injection]]
id = "hook_window_input"
kind = "HEAD"
target = "horizon_client::game::follow_keymap"
helper = "hook_window_input.rs"
bindings = [
  { name = "event", ty = "&mut winit::event::WindowEvent", value = "&mut *event" },
]
