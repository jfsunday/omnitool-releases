[mod]
id = "omnitool"
version = "0.1.0"
priority = 100

# The commit it was written against. It is pinned: besides the native hook points
# it reads private `Game` fields (glue.rs) and injects into private functions,
# so it only builds on this Horizon commit.
[compatibility]
horizon_revision = "1da354b67a509812c4141b67de2affd6de65c342"

# The modules: each file is a module of `game` here and of the Cargo crate
# (src/lib.rs) under the same name, so `super::omnitool_core` is the same
# code in both. glue.rs holds the game types and is only here.
[[module]]
id = "core"
file = "crates/horizon-client/src/game.rs"
name = "omnitool_core"
source = "core.rs"

