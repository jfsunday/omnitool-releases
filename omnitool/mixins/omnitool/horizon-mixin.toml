# Render tweaks. The fog and the camera overlays are changed after the original
# ran: HEAD with a guard and Break, because setup_fog / frame_fog / screen_quads
# hold closures or macros that RETURN cannot cross (screen_quads even a macro,
# so the hook sits in ScreenEffects::build in the render crate).
[[injection]]
id = "hook_fog"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::render_tick::Game<'_>::frame_fog"
helper = "hook_fog.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "sky", ty = "&horizon_client::environment::Sky", value = "sky" },
  { name = "biome", ty = "u16", value = "biome" },
  { name = "water_fog_color", ty = "[f32; 3]", value = "water_fog_color" },
]

[[injection]]
id = "hook_quads"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::screen_effects::ScreenEffects::build"
helper = "hook_quads.rs"
bindings = [
  { name = "this", ty = "&ScreenEffects", value = "&*self" },
  { name = "input", ty = "&ScreenInputs", value = "input" },
]

[[injection]]
id = "hook_crosshair"
kind = "RETURN"
target = "horizon_client_render::hud_layout::crosshair"
helper = "hook_crosshair.rs"
bindings = [
  { name = "value", ty = "Vec<GuiDraw>", value = "$value" },
]

[[injection]]
id = "hook_hurt_tilt"
kind = "MODIFY_ARG"
target = "horizon_client_render::camera::bob_matrix"
selector = "bob_hurt"
require = 1
ordinal = 0
argument = 1
helper = "hook_hurt_tilt.rs"
bindings = [
  { name = "value", ty = "f64", value = "$value" },
]

[[injection]]
id = "hook_hurt_bob"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::camera::bob_view"
helper = "hook_hurt_bob.rs"
bindings = [
  { name = "state", ty = "&BobState", value = "state" },
]

